<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:2400px;height:900px;overflow:hidden;background:#1a1d3a}
  .bg{position:absolute;inset:0;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(140px)}
  .grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay}
  .dots{position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.35) 1.2px,transparent 1.6px);
    background-size:18px 18px;
    -webkit-mask-image:radial-gradient(ellipse 34% 60% at 78% 62%,#000 0%,transparent 70%);
    opacity:.45}
  svg.art{position:absolute;left:0;top:0}
</style></head>
<body>
<div class="bg">
  <div class="blob" style="left:-300px;top:-250px;width:1300px;height:900px;background:#1f6f79"></div>
  <div class="blob" style="left:600px;top:-300px;width:1100px;height:800px;background:#f0b27d;opacity:.9"></div>
  <div class="blob" style="left:1400px;top:-200px;width:1300px;height:1000px;background:#6d4df2"></div>
  <div class="blob" style="left:300px;top:450px;width:1200px;height:800px;background:#3a2f8f"></div>
  <div class="blob" style="left:1300px;top:550px;width:1100px;height:700px;background:#e0689f;opacity:.75"></div>
  <div class="blob" style="left:900px;top:250px;width:700px;height:500px;background:#f6d7b4;opacity:.45"></div>
  <div class="dots"></div>
  <svg class="grain" width="2400" height="900"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>

<svg class="art" width="2400" height="900" viewBox="0 0 2400 900" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="fadeUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- history pages receding upward (loaded on demand) -->
  <g stroke="#fff">
    <rect x="1000" y="40"  width="400" height="54" rx="12" fill="url(#glass)" stroke-opacity=".25" stroke-width="1.5"/>
    <rect x="970"  y="86"  width="460" height="62" rx="14" fill="url(#glass)" stroke-opacity=".38" stroke-width="1.5"/>
    <rect x="936"  y="138" width="528" height="70" rx="16" fill="url(#glass)" stroke-opacity=".55" stroke-width="1.75"/>
    <!-- faint content lines on the pages -->
    <g stroke-opacity=".35" stroke-width="5">
      <line x1="1030" y1="67" x2="1180" y2="67"/>
      <line x1="1002" y1="117" x2="1200" y2="117"/><line x1="1220" y1="117" x2="1300" y2="117"/>
      <line x1="970" y1="173" x2="1150" y2="173"/><line x1="1170" y1="173" x2="1340" y2="173"/>
    </g>
  </g>

  <!-- glow behind main window -->
  <rect x="820" y="230" width="760" height="600" rx="36" fill="#fff" opacity=".10" filter="url(#soft)"/>

  <!-- main terminal window -->
  <g stroke="#fff">
    <rect x="850" y="228" width="700" height="600" rx="28" fill="url(#glass)" stroke-opacity=".85" stroke-width="2.25"/>
    <!-- title bar -->
    <line x1="850" y1="282" x2="1550" y2="282" stroke-opacity=".45" stroke-width="1.5"/>
    <circle cx="884" cy="255" r="7" stroke-opacity=".8" stroke-width="2"/>
    <circle cx="910" cy="255" r="7" stroke-opacity=".8" stroke-width="2"/>
    <circle cx="936" cy="255" r="7" stroke-opacity=".8" stroke-width="2"/>

    <!-- transcript -->
    <g stroke-width="7" stroke-opacity=".6">
      <line x1="890" y1="322" x2="1150" y2="322"/>
      <line x1="890" y1="348" x2="1310" y2="348"/>
      <line x1="890" y1="374" x2="1220" y2="374"/>
    </g>
    <!-- collapsed tool output block -->
    <rect x="890" y="402" width="600" height="46" rx="10" fill="#fff" fill-opacity=".08" stroke-opacity=".6" stroke-width="1.75"/>
    <path d="M910 416 l9 9 l-9 9" stroke-width="2.5" stroke-opacity=".9"/>
    <line x1="938" y1="425" x2="1130" y2="425" stroke-width="7" stroke-opacity=".55"/>
    <line x1="1400" y1="425" x2="1466" y2="425" stroke-width="7" stroke-opacity=".3"/>
    <!-- diff block -->
    <rect x="890" y="466" width="600" height="112" rx="10" fill="#fff" fill-opacity=".06" stroke-opacity=".45" stroke-width="1.5"/>
    <g stroke-width="2.25" stroke-opacity=".85">
      <path d="M908 494 h12 M914 488 v12"/>
      <path d="M908 522 h12 M914 516 v12"/>
      <path d="M908 550 h12"/>
    </g>
    <g stroke-width="6" stroke-opacity=".5">
      <line x1="936" y1="494" x2="1200" y2="494"/>
      <line x1="936" y1="522" x2="1320" y2="522"/>
      <line x1="936" y1="550" x2="1140" y2="550"/>
    </g>
    <g stroke-width="7" stroke-opacity=".6">
      <line x1="890" y1="610" x2="1270" y2="610"/>
      <line x1="890" y1="636" x2="1180" y2="636"/>
    </g>

    <!-- scrollbar: thumb near top = deep in history -->
    <line x1="1522" y1="306" x2="1522" y2="664" stroke-opacity=".25" stroke-width="4"/>
    <line x1="1522" y1="312" x2="1522" y2="360" stroke-opacity=".95" stroke-width="6"/>

    <!-- composer (pinned) -->
    <rect x="876" y="680" width="648" height="70" rx="16" fill="#fff" fill-opacity=".16" stroke-opacity="1" stroke-width="2.5"/>
    <path d="M900 705 l10 10 l-10 10" stroke-width="2.75"/>
    <rect x="926" y="702" width="14" height="26" rx="2" fill="#fff" stroke="none" opacity=".95"/>
    <circle cx="1492" cy="715" r="17" stroke-width="2.25"/>
    <path d="M1492 724 v-17 M1485 714 l7 -7 l7 7" stroke-width="2.25"/>
    <!-- status line -->
    <line x1="850" y1="768" x2="1550" y2="768" stroke-opacity=".35" stroke-width="1.5"/>
    <circle cx="890" cy="787" r="4.5" fill="#fff" stroke="none" opacity=".85"/>
    <g stroke-width="5" stroke-opacity=".4">
      <line x1="906" y1="787" x2="990" y2="787"/><line x1="1400" y1="787" x2="1510" y2="787"/>
    </g>
    <!-- hints row: the bottom row, below the status line -->
    <g stroke-width="5" stroke-opacity=".4">
      <line x1="890" y1="810" x2="960" y2="810"/><line x1="984" y1="810" x2="1060" y2="810"/><line x1="1084" y1="810" x2="1150" y2="810"/>
    </g>
  </g>

  <!-- dashed thread from history into window -->
  <path d="M1200 214 V226" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-dasharray="3 6"/>

  <!-- fullscreen viewfinder corners -->
  <g stroke="#fff" stroke-width="3" stroke-opacity=".9">
    <path d="M790 250 v-60 h60"/>
    <path d="M1610 250 v-60 h-60"/>
    <path d="M790 806 v60 h60"/>
    <path d="M1610 806 v60 h-60"/>
  </g>
</svg>
</body></html>
