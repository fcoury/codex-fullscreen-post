<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="b-fig.css">
<style>
  svg text{font-family:"JetBrains Mono",monospace;fill:var(--ink)}
  .h{font-size:14px;font-weight:700;letter-spacing:.09em}
  .b{font-size:16.5px;font-weight:700}
  .m{font-size:13.5px;fill:var(--muted)}
  .mono{font-family:'JetBrains Mono',monospace}
</style></head><body>
<svg width="720" height="1080" viewBox="0 0 720 1080" fill="none">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#262932" stroke-width="3"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" stroke="#8e919c" stroke-width="1.6" fill="none"/>
    </marker>
  </defs>

  <!-- ============ CLASSIC ============ -->
  <rect x="1" y="1" width="718" height="538" rx="4" stroke="#2a2d36" stroke-width="1.5" fill="#0d0e12"/>
  <text x="28" y="44" class="h">CLASSIC SCROLLBACK</text>

  <g>
    <rect x="40" y="76"  width="260" height="28" rx="2" fill="url(#hatch)" stroke="#2a2d36"/>
    <rect x="40" y="112" width="260" height="28" rx="2" fill="url(#hatch)" stroke="#2a2d36"/>
    <rect x="40" y="148" width="260" height="28" rx="2" fill="url(#hatch)" stroke="#2a2d36"/>
  </g>
  <line x1="28" y1="184" x2="312" y2="184" stroke="#ff6b4a" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#131a2b" stroke="#7aa2ff" stroke-width="1.5">
    <rect x="40" y="192" width="260" height="28" rx="2"/>
    <rect x="40" y="228" width="260" height="28" rx="2"/>
    <rect x="40" y="264" width="260" height="28" rx="2"/>
    <rect x="40" y="300" width="260" height="28" rx="2"/>
    <rect x="40" y="336" width="260" height="28" rx="2"/>
    <rect x="40" y="376" width="260" height="28" rx="2"/>
    <rect x="40" y="412" width="260" height="28" rx="2"/>
  </g>
  <rect x="40" y="448" width="260" height="32" rx="2" fill="#2a140e" stroke="#ff6b4a" stroke-width="2"/>
  <text x="54" y="469" class="mono" style="font-size:15px;fill:#ff6b4a">› _</text>
  <rect x="28" y="368" width="284" height="122" rx="4" stroke="#ece8df" stroke-width="2.5"/>
  <text x="170" y="518" class="m" text-anchor="middle">your screen</text>

  <text x="344" y="112" class="b">Dropped</text>
  <text x="344" y="137" class="m">Past the scrollback limit,</text>
  <text x="344" y="158" class="m">which varies by terminal</text>

  <path d="M322 194 h8 v244 h-8" stroke="#8e919c" stroke-width="1.5"/>
  <text x="344" y="276" class="b">Loaded up front</text>
  <text x="344" y="301" class="m">The whole conversation renders</text>
  <text x="344" y="322" class="m">at startup, so long sessions</text>
  <text x="344" y="343" class="m">get slower to open</text>

  <text x="344" y="462" class="b">Prompt scrolls with it</text>
  <text x="344" y="487" class="m">Scroll back to reread a plan and</text>
  <text x="344" y="508" class="m">your prompt leaves the screen</text>

  <!-- ============ FULLSCREEN ============ -->
  <g transform="translate(0 558)">
  <rect x="1" y="1" width="718" height="518" rx="4" stroke="#2a2d36" stroke-width="1.5" fill="#0d0e12"/>
  <text x="28" y="44" class="h">FULLSCREEN</text>

  <g fill="#0d0e12" stroke="#454a57" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="40" y="76"  width="260" height="28" rx="2"/>
    <rect x="40" y="112" width="260" height="28" rx="2"/>
    <rect x="40" y="148" width="260" height="28" rx="2"/>
  </g>
  <rect x="28" y="182" width="284" height="172" rx="4" fill="#101117" stroke="#ece8df" stroke-width="2.5"/>
  <g fill="#131a2b" stroke="#7aa2ff" stroke-width="1.5">
    <rect x="40" y="194" width="260" height="28" rx="2"/>
    <rect x="40" y="230" width="260" height="28" rx="2"/>
    <rect x="40" y="266" width="260" height="28" rx="2"/>
  </g>
  <rect x="40" y="306" width="260" height="36" rx="2" fill="#2a140e" stroke="#ff6b4a" stroke-width="2"/>
  <text x="54" y="329" class="mono" style="font-size:15px;fill:#ff6b4a">› _</text>
  <path d="M16 290 V86" stroke="#8e919c" stroke-width="1.5" marker-end="url(#arr)"/>
  <g fill="#0d0e12" stroke="#454a57" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="40" y="366" width="260" height="28" rx="2"/>
    <rect x="40" y="402" width="260" height="28" rx="2"/>
    <rect x="40" y="438" width="260" height="28" rx="2"/>
  </g>
  <text x="170" y="498" class="m" text-anchor="middle">your screen, scrolled back</text>

  <text x="344" y="104" class="b">Loaded on demand</text>
  <text x="344" y="129" class="m">Scroll up and older history loads,</text>
  <text x="344" y="150" class="m">all the way back to the start</text>

  <path d="M322 196 h8 v96 h-8" stroke="#8e919c" stroke-width="1.5"/>
  <text x="344" y="232" class="b">Only what you need</text>
  <text x="344" y="257" class="m">Sessions open fast,</text>
  <text x="344" y="278" class="m">however long they get</text>

  <text x="344" y="322" class="b">Composer stays put</text>
  <text x="344" y="347" class="m">Pinned to the screen while</text>
  <text x="344" y="368" class="m">you scroll the history</text>
  </g>
</svg>
</body></html>
